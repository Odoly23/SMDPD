{% load static %}
<!DOCTYPE html>
<html lang="tet">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<title>SMDPD - Verifika 2FA</title>
		<link rel="stylesheet" href="{% static 'main/css/bootstrap.min.css' %}">
		<link rel="icon" href="{% static 'main/images/favicon.png' %}">
		<link rel="stylesheet" href="{% static 'main/font-awesome/css/font-awesome.min.css' %}">
		<link rel="stylesheet" href="{% static 'main/css/style.default.css' %}">
		<link rel="stylesheet" href="{% static 'main/css/main.css' %}">
	</head>
	<body>
		<div class="page login-page">
			<div class="container d-flex align-items-center">
				<div class="form-outer text-center d-flex align-items-center">
					<div class="form-inner w-100">
						<img class="logo-plp rounded-circle" src="{% static 'main/images/logo_plp.png' %}" alt="PLP">
						<h1>Verifikasaun Rua Faktór</h1>
						<p>Hakerek kódigu 6 dígitu husi aplikasaun authenticator ba <strong>{{ username }}</strong>, ka kódigu rekuperasaun.</p>
						{% if erru %}<div class="alert alert-danger p-2 mt-3">{{ erru }}</div>{% endif %}
						<form method="post" autocomplete="off">
							{% csrf_token %}
							<input class="form-control form-control-lg text-center" style="letter-spacing:.3em" type="text" name="kode" inputmode="numeric" autocomplete="one-time-code" maxlength="12" autofocus required placeholder="000000">
							<button class="btn btn-primary btn-block mt-3" type="submit">Verifika <i class="fa fa-shield"></i></button>
							<a class="btn btn-link btn-block" href="{% url 'login' %}">Fila ba login</a>
						</form>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
