{% extends "main/layout.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row">
	<div class="col-md-6">
		<div class="card">
			<div class="card-header">Troka Password</div>
			<div class="card-body">
				<form method="post">
					{% csrf_token %}
					{{ form|crispy }}
					<a class="btn btn-secondary" href="{% url 'home' %}"><i class="fa fa-close"></i> Cancela</a>
					<button class="btn btn-primary" type="submit">Rai <i class="fa fa-save"></i></button>
				</form>
			</div>
		</div>
	</div>
</div>
{% endblock %}
