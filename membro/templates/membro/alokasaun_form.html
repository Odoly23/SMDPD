{% extends "main/form.html" %}
{% load static %}
{% block form_scripts %}
<script src="{% static 'main/js_custom/membro_search.js' %}"></script>
<script type="text/javascript">
	// hatudu unidade (departamentu/munisipiu/postu/suku/aldeia/organizasaun) tuir nivel
	function toggleUnit() {
		var n = ($('#id_nivel').val() || '').toLowerCase();
		$('.unit-departamentu, .unit-munisipiu, .unit-postu, .unit-suku, .unit-aldeia, .unit-organizasaun').hide();
		if (n) { $('.unit-' + n).show(); }
	}
	$('#id_nivel').on('change', toggleUnit);
	toggleUnit();
	// pozisaun ne'ebé iha ona iha nivel ida-ida
	var POZISAUN = {
		'Nasional': ['Presidente', 'Vice 1', 'Vice 2', 'Vice 3', 'Vice 4', 'Sekretaria', 'Membru'],
		'Departamentu': ['Presidente Departamentu', 'Koordenador', 'Vice 1', 'Vice 2', 'Vice 3', 'Vice 4', 'Membru'],
		'Munisipiu': ['Koordenador', 'Vice 1', 'Vice 2', 'Vice 3', 'Vice 4', 'Sekretaria', 'Membru'],
		'Postu': ['Koordenador', 'Vice 1', 'Vice 2', 'Vice 3', 'Vice 4', 'Sekretaria', 'Membru'],
		'Suku': ['Koordenador', 'Vice 1', 'Vice 2', 'Vice 3', 'Vice 4', 'Sekretaria', 'Membru'],
		'Aldeia': ['Koordenador', 'Vice 1', 'Vice 2', 'Vice 3', 'Vice 4', 'Sekretaria', 'Membru'],
		'Organizasaun': ['Koordenador', 'Membru']
	};
	function filtraPozisaun() {
		var ok = POZISAUN[$('#id_nivel').val()] || [];
		$('#id_pozisaun option').each(function () {
			var v = $(this).val();
			$(this).prop('hidden', v !== '' && ok.indexOf(v) < 0).prop('disabled', v !== '' && ok.indexOf(v) < 0);
		});
		if (ok.indexOf($('#id_pozisaun').val()) < 0) { $('#id_pozisaun').val(''); }
	}
	$('#id_nivel').on('change', filtraPozisaun);
	filtraPozisaun();
</script>
{% endblock %}
